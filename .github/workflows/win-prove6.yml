name: Win64
  
env:
  TEST_JOBS: 1

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  raku:
    strategy:
      matrix:
        os:
          - windows-latest
        raku-version:
          - 'latest'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
      - name: Install Dependencies
        run: |
            zef --exclude='curl:ver<4>:from<native>' install --debug --/test --test-depends --deps-only .
      - name: Run Tests
        run: prove6 -I.
      - name: Install
        run: zef install . 
